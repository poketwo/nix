apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-snapshot-cleanup-vaporeon
  namespace: prometheus
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - command:
        - chroot
        - /host
        - /run/current-system/sw/bin/bash
        - -c
        - |
          export PATH=/run/current-system/sw/bin
          set -euo pipefail
          ds=mongo/mongo

          echo "before:"
          zfs list -o name,used,avail,usedbysnapshots "$ds"
          zfs list -d 1 -t snapshot -o name,creation,used -s creation "$ds"

          mapfile -t hourlies < <(zfs list -H -d 1 -t snapshot -o name -s creation "$ds" | grep '_hourly$' || true)
          extra=$(( ${#hourlies[@]} - 12 ))
          for (( i = 0; i < extra; i++ )); do
            zfs destroy -v "${hourlies[i]}"
          done
          oldest=$(zfs list -H -d 1 -t snapshot -o name -s creation "$ds" | grep '_daily$' | head -n 1 || true)
          day=${oldest#*@autosnap_}
          day=${day:0:10}
          if [[ -n "$oldest" && ! "$day" > "2026-11-03" ]]; then
            zfs destroy -v "$oldest"
          else
            echo "oldest daily ${oldest:-none} is newer than 2026-11-03, keeping it"
          fi

          echo "after:"
          zfs list -o name,used,avail,usedbysnapshots "$ds"
        image: busybox:1.37
        name: cleanup
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host-root
      hostPID: true
      nodeName: vaporeon
      restartPolicy: Never
      volumes:
      - hostPath:
          path: /
        name: host-root
