name: Build NixOS Hosts

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v10

  hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: List hosts
        id: list
        run: echo "hosts=$(ls hosts | sed 's/\.nix$//' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.hosts.outputs.hosts) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build ${{ matrix.host }}
        run: nix build ".#nixosConfigurations.$HOST.config.system.build.toplevel"
        env:
          HOST: ${{ matrix.host }}
