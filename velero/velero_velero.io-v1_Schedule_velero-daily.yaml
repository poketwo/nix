apiVersion: velero.io/v1
kind: Schedule
metadata:
  labels:
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: velero
    app.kubernetes.io/version: 1.18.2
    helm.sh/chart: velero-12.2.2
  name: velero-daily
  namespace: velero
spec:
  schedule: 30 4 * * *
  template:
    excludedNamespaces:
    - velero
    - kube-system
    - cilium
    - rook-ceph
    - argocd
    - cert-manager
    snapshotMoveData: true
    ttl: 168h
