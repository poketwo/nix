apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test-success
  labels:
    app: redis-ha
    chart: redis-ha-4.39.0
    heritage: Helm
    release: gateway-valkey
  name: gateway-valkey-configmap-test
  namespace: poketwo
spec:
  containers:
  - args:
    - --shell=sh
    - /readonly-config/init.sh
    image: koalaman/shellcheck:v0.11.0
    name: check-init
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - mountPath: /readonly-config
      name: config
      readOnly: true
  nodeSelector: {}
  restartPolicy: Never
  tolerations: []
  volumes:
  - configMap:
      name: gateway-valkey-configmap
    name: config
