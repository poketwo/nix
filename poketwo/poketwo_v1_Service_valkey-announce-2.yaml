apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-ha
    chart: redis-ha-4.39.0
    heritage: Helm
    release: valkey
  name: valkey-announce-2
  namespace: poketwo
spec:
  ports:
  - name: tcp-server
    port: 6379
    protocol: TCP
    targetPort: redis
  - name: tcp-sentinel
    port: 26379
    protocol: TCP
    targetPort: sentinel
  publishNotReadyAddresses: true
  selector:
    app: redis-ha
    release: valkey
    statefulset.kubernetes.io/pod-name: valkey-server-2
  type: ClusterIP
