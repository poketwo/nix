apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: gateway-cache
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: valkey
    app.kubernetes.io/version: 9.1.2
    helm.sh/chart: valkey-0.12.0
  name: gateway-cache-valkey
  namespace: poketwo
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  storageClassName: rbd-nvme
  volumeMode: Filesystem
