apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-ha
    chart: redis-ha-4.39.0
    heritage: Helm
    release: gateway-valkey
  name: gateway-valkey-announce-1
  namespace: poketwo
spec:
  ports:
  - name: tcp-server
    port: 6379
    protocol: TCP
    targetPort: redis
  - name: tcp-sentinel
    port: 26379
    protocol: TCP
    targetPort: sentinel
  publishNotReadyAddresses: true
  selector:
    app: redis-ha
    release: gateway-valkey
    statefulset.kubernetes.io/pod-name: gateway-valkey-server-1
  type: ClusterIP
