apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: gateway-cache
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: valkey
    app.kubernetes.io/version: 9.1.2
    helm.sh/chart: valkey-0.12.0
  name: gateway-cache-valkey
  namespace: poketwo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: gateway-cache
      app.kubernetes.io/name: valkey
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: bdead5f7b0003b8908dd46a6ca6e2f10
        checksum/initconfig: 9964191f58f592ccf0ecc3c69f165c0b
      labels:
        app.kubernetes.io/instance: gateway-cache
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - /data/conf/valkey.conf
        command:
        - valkey-server
        env:
        - name: VALKEY_LOG_LEVEL
          value: notice
        image: docker.io/valkey/valkey:9.1.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        name: gateway-cache-valkey
        ports:
        - containerPort: 6379
          name: tcp
          protocol: TCP
        resources:
          limits:
            cpu: 1000m
            memory: 20Gi
          requests:
            memory: 20Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          exec:
            command:
            - valkey-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /etc/valkey
          name: valkey-acl
      - env:
        - name: REDIS_ALIAS
          value: gateway-cache-valkey
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: gateway-cache
        image: ghcr.io/oliver006/redis_exporter:v1.79.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          tcpSocket:
            port: metrics
        name: metrics
        ports:
        - containerPort: 9121
          name: metrics
        readinessProbe:
          httpGet:
            path: /
            port: metrics
        startupProbe:
          tcpSocket:
            port: metrics
      initContainers:
      - command:
        - /scripts/init.sh
        image: docker.io/valkey/valkey:9.1.2
        imagePullPolicy: IfNotPresent
        name: gateway-cache-valkey-init
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /scripts
          name: scripts
        - mountPath: /usr/local/etc/valkey/valkey.conf
          name: valkey-config
          subPath: valkey.conf
        - mountPath: /etc/valkey
          name: valkey-acl
        - mountPath: /valkey-users-secret
          name: valkey-users-secret
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: gateway-cache-valkey
      volumes:
      - configMap:
          defaultMode: 365
          name: gateway-cache-valkey-init-scripts
        name: scripts
      - emptyDir:
          medium: Memory
        name: valkey-acl
      - configMap:
          name: gateway-cache-valkey-config
        name: valkey-config
      - name: valkey-data
        persistentVolumeClaim:
          claimName: gateway-cache-valkey
      - name: valkey-users-secret
        secret:
          defaultMode: 256
          secretName: gateway-cache
