apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis-ha
    chart: redis-ha-4.39.0
    component: haproxy
    heritage: Helm
    release: gateway-valkey
  name: gateway-valkey-haproxy
  namespace: poketwo
spec:
  replicas: 3
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: redis-ha-haproxy
      component: haproxy
      release: gateway-valkey
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: f801997dd0b8d0a17e51f21b55b3f33ff6c5529a8e593241fd174e234f669da1
      labels:
        app: redis-ha-haproxy
        component: haproxy
        release: gateway-valkey
      name: gateway-valkey-haproxy
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: redis-ha-haproxy
                component: haproxy
                release: gateway-valkey
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      containers:
      - env:
        - name: AUTH
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: gateway-cache
        image: public.ecr.aws/docker/library/haproxy:3.3.10-alpine
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        livenessProbe:
          httpGet:
            path: /healthz
            port: probe
          initialDelaySeconds: 5
          periodSeconds: 3
        name: haproxy
        ports:
        - containerPort: 8888
          name: probe
        - containerPort: 6379
          name: redis
        readinessProbe:
          httpGet:
            path: /healthz
            port: probe
          initialDelaySeconds: 5
          periodSeconds: 3
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /usr/local/etc/haproxy
          name: data
        - mountPath: /run/haproxy
          name: shared-socket
      initContainers:
      - args:
        - /readonly/haproxy_init.sh
        command:
        - sh
        image: public.ecr.aws/docker/library/haproxy:3.3.10-alpine
        imagePullPolicy: IfNotPresent
        name: config-init
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /readonly
          name: config-volume
          readOnly: true
        - mountPath: /data
          name: data
      nodeSelector: {}
      securityContext:
        fsGroup: 99
        runAsNonRoot: true
        runAsUser: 99
      serviceAccountName: gateway-valkey-haproxy
      tolerations: []
      volumes:
      - configMap:
          name: gateway-valkey-configmap
        name: config-volume
      - emptyDir: {}
        name: data
      - emptyDir: {}
        name: shared-socket
