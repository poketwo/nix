apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  namespace: poketwo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  serviceName: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - env:
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: TOKEN
              name: poketwo
        - name: LOG_FORMAT
          value: json
        - name: METRICS_ADDR
          value: '[::]:9000'
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: gateway-redis
        - name: RUST_LOG
          value: info
        - name: SHARDS_PER_REPLICA
          value: '400'
        - name: SHARDS_TOTAL
          value: '1600'
        - name: WORKERS
          value: '1'
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@gateway-redis
        image: ghcr.io/poketwo/poketwo-rs:production
        imagePullPolicy: Always
        name: gateway
        ports:
        - containerPort: 9000
          name: metrics
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
      imagePullSecrets:
      - name: ghcr-auth
      terminationGracePeriodSeconds: 30
