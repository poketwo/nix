apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-ha
    chart: redis-ha-4.39.0
    exporter: enabled
    heritage: Helm
    release: gateway-valkey
  name: gateway-valkey
  namespace: poketwo
spec:
  clusterIP: None
  ports:
  - name: tcp-server
    port: 6379
    protocol: TCP
    targetPort: redis
  - name: tcp-sentinel
    port: 26379
    protocol: TCP
    targetPort: sentinel
  - name: http-exporter-port
    port: 9121
    protocol: TCP
    targetPort: exporter-port
  selector:
    app: redis-ha
    release: gateway-valkey
  type: ClusterIP
