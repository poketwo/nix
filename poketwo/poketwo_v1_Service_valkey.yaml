apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-ha
    chart: redis-ha-4.39.0
    heritage: Helm
    release: valkey
  name: valkey
  namespace: poketwo
spec:
  clusterIP: None
  ports:
  - name: tcp-server
    port: 6379
    protocol: TCP
    targetPort: redis
  - name: tcp-sentinel
    port: 26379
    protocol: TCP
    targetPort: sentinel
  selector:
    app: redis-ha
    release: valkey
  type: ClusterIP
