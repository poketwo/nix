apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana-image-renderer
    app.kubernetes.io/version: 13.0.1
    helm.sh/chart: grafana-12.0.0
  name: grafana-image-renderer
  namespace: grafana
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: grafana
      app.kubernetes.io/name: grafana-image-renderer
  template:
    metadata:
      annotations:
        checksum/config: b0b209628a3449e4f5c8706879959a8ca418f1ef3bafa28cc1374bcab0106216
      labels:
        app.kubernetes.io/instance: grafana
        app.kubernetes.io/name: grafana-image-renderer
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: grafana-image-renderer
        - name: HTTP_HOST
          value: 0.0.0.0
        - name: HTTP_PORT
          value: '8081'
        - name: XDG_CACHE_HOME
          value: /tmp/.chromium
        - name: XDG_CONFIG_HOME
          value: /tmp/.chromium
        image: docker.io/grafana/grafana-image-renderer:v5.12.10
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        name: grafana-image-renderer
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: image-renderer-tmpfs
      volumes:
      - emptyDir: {}
        name: image-renderer-tmpfs
