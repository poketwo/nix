apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana-image-renderer
    app.kubernetes.io/version: 13.0.1
    helm.sh/chart: grafana-12.0.0
  name: grafana-image-renderer
  namespace: grafana
spec:
  destination:
    create: true
    name: grafana-image-renderer
    type: Opaque
  mount: hfym-ds
  path: grafana/grafana-image-renderer
  type: kv-v2
