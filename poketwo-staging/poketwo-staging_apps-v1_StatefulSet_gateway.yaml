apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  namespace: poketwo-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  serviceName: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - env:
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: TOKEN
              name: poketwo
        - name: LOG_FORMAT
          value: json
        - name: METRICS_ADDR
          value: '[::]:9000'
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: gateway-cache
        - name: RUST_LOG
          value: info
        - name: SHARDS_PER_REPLICA
          value: '1'
        - name: SHARDS_TOTAL
          value: '1'
        - name: WORKERS
          value: '1'
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@gateway-cache-valkey
        image: ghcr.io/poketwo/poketwo-rs:production
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /livez
            port: metrics
          periodSeconds: 30
          timeoutSeconds: 5
        name: gateway
        ports:
        - containerPort: 9000
          name: metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 2
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      imagePullSecrets:
      - name: ghcr-auth
      terminationGracePeriodSeconds: 30
